services:
  postgres:
    image: postgres:16-alpine
    container_name: aiia_ctms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ctms_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctms_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-aiia_ctms_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctms_admin -d aiia_ctms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aiia_ctms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
